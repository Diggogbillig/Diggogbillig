<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmeldelser | Digg&Billig</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:1000px;
    margin:auto;
    padding:40px;
    background:#f5f5f5;
}

h1{
    text-align:center;
    color:#2E7D32;
    margin-bottom:40px;
}

.review{
    background:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.review h3{
    color:#2E7D32;
    margin-bottom:10px;
}

.stars{
    color:gold;
    font-size:1.2rem;
    margin-bottom:10px;
}

.btn{
    display:inline-block;
    background:#7ED957;
    color:white;
    padding:15px 30px;
    text-decoration:none;
    border-radius:40px;
    margin-top:20px;
}

</style>

</head>
<body>

<h1>Kundeanmeldelser</h1>

<div class="review">
    <h3>Emma</h3>
    <div class="stars">★★★★★</div>
    <p>Fant masse god mat til en veldig billig pris.</p>
</div>

<div class="review">
    <h3>Jonas</h3>
    <div class="stars">★★★★★</div>
    <p>En super måte å redusere matsvinn på samtidig som man sparer penger.</p>
</div>

<div class="review">
    <h3>Sara</h3>
    <div class="stars">★★★★☆</div>
    <p>God opplevelse og enkel å bruke.</p>
</div>
